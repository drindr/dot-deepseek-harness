# The recovery bundle patch: a one-shot recovery session directly over dsh-base.
# It mounts no Host, HTTP server, Web runtime, or browser plugin — the tree is
# base only, so a broken WEB profile plugin cannot stop this from booting. An
# ordinary provider plugin (`recovery/startup`) reads the task positional
# (`dsh --profile recovery "fix <plugin>"`), and the direct driver creates one
# Agent through the core registry and prints its durable result.

- id: system-prompt
  config:
    persona: >-
      You are a coding agent powered by the {{model}} model. Your working directory is {{cwd}}.

# The shared module-reload HMR row stays off; the launcher's watch-only
# fallback still keeps the user patch layers live until the run exits.
- id: hmr
  disabled: true

- id: tools
  config:
    # Keep the same temporary process-wide Code Mode opt-in as the Web surface.
    mode: !!js process.env.DSH_TOOLS_MODE

- insert:
    # Code Mode is a core execution capability, not a Web component.
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    # Reads its task from the ordinary recoveryStartup provider.
    - id: recovery-startup
      name: 'recovery/startup'

    - id: recovery-runner
      name: 'recovery'
      inject: [recoveryStartup]
      config:
        task: !!js ctx.recoveryStartup.task
